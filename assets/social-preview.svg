<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Ryan Duguid - Australian Computational Accounting Stack">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F9F7F1" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2A36" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" fill="#F4F0E6"/>

  <!-- Subtle Ledger Grid Lines -->
  <g stroke="#E2D9C5" stroke-width="1" opacity="0.6">
    <path d="M0 80 H1280"/>
    <path d="M0 160 H1280"/>
    <path d="M0 240 H1280"/>
    <path d="M0 320 H1280"/>
    <path d="M0 400 H1280"/>
    <path d="M0 480 H1280"/>
    <path d="M0 560 H1280"/>
    <path d="M160 0 V640"/>
    <path d="M320 0 V640"/>
    <path d="M480 0 V640"/>
    <path d="M640 0 V640"/>
    <path d="M800 0 V640"/>
    <path d="M960 0 V640"/>
    <path d="M1120 0 V640"/>
  </g>

  <!-- Accent Red Double-Entry Margin Lines -->
  <path d="M72 0 V640" stroke="#9C2B2B" stroke-width="1.8" opacity="0.4"/>
  <path d="M78 0 V640" stroke="#9C2B2B" stroke-width="1.2" opacity="0.25"/>

  <!-- Header Wordmark -->
  <text x="110" y="96" font-family="Georgia, Times New Roman, serif" font-size="52" font-weight="bold" fill="#1B2A36" letter-spacing="-0.5">Ryan Duguid</text>
  <text x="110" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#7A6855" letter-spacing="1.2">AUSTRALIAN COMPUTATIONAL ACCOUNTING &amp; DETERMINISTIC AGENTS</text>

  <!-- Badges Row -->
  <g transform="translate(110, 154)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#002B49"/>
    <text x="95" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CA ANZ Provisional</text>
    <!-- Badge 2 -->
    <rect x="200" y="0" width="180" height="28" rx="6" fill="#13B5EA"/>
    <text x="290" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Xero Advisor L3</text>
    <!-- Badge 3 -->
    <rect x="390" y="0" width="190" height="28" rx="6" fill="#3776AB"/>
    <text x="485" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SAP S/4HANA FI &amp; CO</text>
    <!-- Badge 4 -->
    <rect x="590" y="0" width="180" height="28" rx="6" fill="#8A2BE2"/>
    <text x="680" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MCP Standard Server</text>
  </g>

