    <text x="20" y="70" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1B2A36">JohnSpenceOgilvy</text>
    <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6B7A85">Xero Trial Balance CSV Exporter</text>
    <path d="M20 115 H310" stroke="#E5DECE" stroke-width="1"/>
    <text x="20" y="145" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1B2A36">SirAlexanderFitzgerald</text>
    <text x="20" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6B7A85">Power Query (M) &amp; VBA Automation</text>
