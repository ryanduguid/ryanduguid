    <text x="20" y="220" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1B2A36">monthly-close-control</text>
    <text x="20" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6B7A85">Deterministic Close &amp; Period Locking</text>
  </g>

  <!-- Card 2: Rules & Engines -->
  <g transform="translate(470, 215)" filter="url(#cardShadow)">
    <rect width="340" height="340" rx="12" fill="url(#cardGrad)" stroke="#D8CDB8" stroke-width="1.2"/>
    <rect width="340" height="40" rx="12" fill="#217346"/>
    <rect y="28" width="340" height="12" fill="#217346"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">2. COMPUTATIONAL ENGINES</text>
    <text x="20" y="70" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1B2A36">Ozzit</text>
    <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6B7A85">130 Native Excel Dynamic LAMBDAs</text>
    <path d="M20 115 H320" stroke="#E5DECE" stroke-width="1"/>
    <text x="20" y="145" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1B2A36">EdwinNixon &amp; LouisGoldberg</text>
    <text x="20" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6B7A85">Corporate Tax (BRE/FAB) &amp; Div 6 Trusts</text>
    <path d="M20 190 H320" stroke="#E5DECE" stroke-width="1"/>
    <text x="20" y="220" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1B2A36">payday-super &amp; RaymondChambers</text>
    <text x="20" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6B7A85">Payday Super 2026 &amp; ATO Benchmarks</text>
  </g>

  <!-- Card 3: AI & Safety Boundaries -->
  <g transform="translate(840, 215)" filter="url(#cardShadow)">
    <rect width="330" height="340" rx="12" fill="url(#cardGrad)" stroke="#D8CDB8" stroke-width="1.2"/>
    <rect width="330" height="40" rx="12" fill="#8A2BE2"/>
    <rect y="28" width="330" height="12" fill="#8A2BE2"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">3. AGENTS &amp; SAFETY GATES</text>
    <text x="20" y="70" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1B2A36">aus-accounting-mcp</text>
    <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6B7A85">Unified Model Context Protocol Server</text>
    <path d="M20 115 H310" stroke="#E5DECE" stroke-width="1"/>
    <text x="20" y="145" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1B2A36">MaryAddisonHamilton</text>
    <text x="20" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6B7A85">Claude Code Skills for Public Practice</text>
    <path d="M20 190 H310" stroke="#E5DECE" stroke-width="1"/>
    <text x="20" y="220" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1B2A36">DrDebits &amp; Safety Gateway</text>
    <text x="20" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6B7A85">APES 110 Ethics &amp; Synthetic Sandboxes</text>
  </g>

  <!-- Footer Watermark -->
  <text x="1170" y="605" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="bold" fill="#7A6855" text-anchor="end">github.com/ryanduguid</text>
</svg>
