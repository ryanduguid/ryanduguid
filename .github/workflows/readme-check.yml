name: readme-check

# Holds README.md and llms.txt to their sources: every link resolves, Ozzit's
# function and help-table counts equal those in functions.csv at Ozzit's latest
# release, the figures quoted from duguid.com.au still appear on the pages they
# link, and llms.txt keeps valid structure, current dates and repository sync.
# tools/readme-check does the checking and exits 0 clean, 1 on drift
# and 2 when a source could not be read (a rate limit, 5xx or timeout that
# outlasted its retries), which warns without failing. It runs daily, so a new
# Ozzit release is compared within a day, as the website's release check is.
#
# A red scheduled run notifies nobody, so drift found on main is also kept in
# one tracking issue, as the website's source-freshness workflow does: opened
# on the first drift, rewritten while drift remains and closed by the first
# clean run. A source that is inconclusive in this run and the 2 runs on main
# before it counts as drift too, since a warning on a green run reaches nobody
# either. Only the issue job can write, and it runs no repository code.

on:
  schedule:
    - cron: "23 6 * * *"
  pull_request:
    paths:
      - README.md
      - llms.txt
      - tools/readme-check/**
      - .github/workflows/readme-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.check.outputs.status }}
    defaults:
      run:
        working-directory: tools/readme-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # Pull requests only: a scheduled run must reach the checker and the issue
      # even when a README edit on main breaks the offline real-README test.
      - name: Format, lint and test the checker
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --release -- -D warnings
          cargo test --locked --release
      - name: Install cargo-deny
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CARGO_DENY_VERSION: "0.22.0"
          CARGO_DENY_SHA256: "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786"
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cargo-deny-bin"
          tar --strip-components=1 -xzf "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/cargo-deny-bin" "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          rm -f "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "$RUNNER_TEMP/cargo-deny-bin" >> "$GITHUB_PATH"
      - name: Check dependency policy
        if: ${{ github.event_name == 'pull_request' }}
        run: cargo deny --locked --config "$GITHUB_WORKSPACE/deny.toml" check licenses sources
      # Release throughout, so the build below reuses the test build's dependencies.
      - name: Build the checker
        run: cargo build --locked --release
      - name: Check README.md and llms.txt against their sources
        id: check
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          tools/readme-check/target/release/readme-check > "$RUNNER_TEMP/report.txt"
          status=$?
          cat "$RUNNER_TEMP/report.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = 2 ]; then
            echo "::warning::A source could not be read in this run; nothing drifted."
            exit 0
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.check.outputs.status != '' }}
        with:
          name: readme-check-report
          path: ${{ runner.temp }}/report.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  issue:
    needs: check
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && contains(fromJSON('["0", "1", "2"]'), needs.check.outputs.status) }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
    env:
      TITLE: README.md has drifted from its sources
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: readme-check-report
          path: ${{ runner.temp }}/report
      - name: Open, update or close the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ needs.check.outputs.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/report/report.txt"
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ "$STATUS" = 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "No drift in $RUN_URL."
            fi
            exit 0
          fi
          # Sources inconclusive in this run and in each of the 2 earlier runs on
          # main, keyed on the check and URL. A missing earlier report breaks the run.
          sources() { sed -nE 's/^INCONCLUSIVE: (.+ [^ ]+): .*$/\1/p' "$1" | sort -u; }
          sources "$report" > "$RUNNER_TEMP/streak.txt"
          earlier=$(gh run list --workflow readme-check.yml --branch main --status completed --limit 20 \
            --json databaseId,event --jq "map(select(.event != \"pull_request\" and .databaseId != $RUN_ID)) | .[0:2] | .[].databaseId")
          [ "$(echo "$earlier" | grep -c .)" = 2 ] || : > "$RUNNER_TEMP/streak.txt"
          for id in $earlier; do
            [ -s "$RUNNER_TEMP/streak.txt" ] || break
            if gh run download "$id" -n readme-check-report -D "$RUNNER_TEMP/run-$id"; then
              sources "$RUNNER_TEMP/run-$id/report.txt" | comm -12 "$RUNNER_TEMP/streak.txt" - > "$RUNNER_TEMP/both.txt"
              mv "$RUNNER_TEMP/both.txt" "$RUNNER_TEMP/streak.txt"
            else
              : > "$RUNNER_TEMP/streak.txt"
            fi
          done
          if [ "$STATUS" = 2 ] && [ ! -s "$RUNNER_TEMP/streak.txt" ]; then
            echo "Inconclusive, and no source failed 3 runs in a row; the issue is unchanged."
            exit 0
          fi
          {
            echo "The README check found statements that no longer match their sources."
            echo "Fix README.md, llms.txt, the source or tools/readme-check/src/facts.rs, then dispatch readme-check.yml on main; a clean run closes this issue."
            echo
            grep -E '^(DRIFT|INCONCLUSIVE): ' "$report" | sed 's/^/- /'
            if [ -s "$RUNNER_TEMP/streak.txt" ]; then
              echo
              echo "Unreadable in this run and the 2 runs before it, so treated as drift:"
              sed 's/^/- /' "$RUNNER_TEMP/streak.txt"
            fi
            echo
            echo "Last checked: $RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$number" ]; then
            # A body edit notifies nobody, so a changed drift list also gets a comment.
            old=$(gh issue view "$number" --json body --jq .body | tr -d '\r' | grep -v '^Last checked: ')
            new=$(grep -v '^Last checked: ' "$RUNNER_TEMP/body.md")
            gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
            if [ "$old" != "$new" ]; then
              gh issue comment "$number" --body "The drift list changed in $RUN_URL."
            fi
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
