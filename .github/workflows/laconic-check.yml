name: laconic-check

# Lints the repository's Markdown prose for Australian English house style:
# em dashes, US spellings, double quotation marks, serial commas, numbers
# written as words and chatbot closers. laconic-check is built from a pinned
# commit of EquityBot/laconic. A finding is a reason to look; where a case is
# legitimate, such as a comma that prevents a misreading, rephrase it rather
# than adding an exception. Files under .github/ are out of scope.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EquityBot/laconic
          ref: 6da4f8eed08a73486ba279c6f972a4e5a2e5a110
          path: .laconic
          persist-credentials: false
      - name: Build laconic-check
        run: cargo build --release --locked --manifest-path .laconic/tools/laconic-check/Cargo.toml
      - name: Lint Markdown prose
        run: |
          git ls-files -z -- '*.md' ':!.github' |
            xargs -0 .laconic/tools/laconic-check/target/release/laconic-check lint
