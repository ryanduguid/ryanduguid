[package]
name = "readme-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "CC-BY-4.0"
publish = false
description = "Checks the profile README's links and quoted facts against their sources"

[dependencies]
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[lints.clippy]
ref_option = "warn"
too_many_lines = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
